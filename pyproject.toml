[project]
name = "eurosat-monitoring"
version = "0.1.0"
description = "Drift monitoring and automated retraining for a EuroSAT land-use classifier in production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "onnxruntime>=1.17",   # runs the served model to get predictions and embeddings
    "scipy>=1.11",         # the two-sample KS test
    "scikit-learn>=1.4",   # PCA and the domain classifier
]

[project.optional-dependencies]
# The registry talks to W&B. Kept optional so the detector runs without an account.
registry = ["wandb>=0.17"]
# Building the bench: the RESISC45 parquet and the figures in the README.
bench = ["pyarrow>=15.0", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitoring"]
